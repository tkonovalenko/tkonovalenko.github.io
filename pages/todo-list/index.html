<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Document</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="wrapper">
        <div class="container">
            <main class="page-content">
                <div class="todo">
                    <div class="todo__card">
                        <ul class="todo__type-btns">
                            <li class="todo__type-btn" data-active="true">
                                <i class="todo__type-btn-icon fa-solid fa-list"></i>
                            </li>
                        </ul>
                        <div class="todo__content">
                            <ul class="todo__list">
                                <li class="todo__list-item" data-checked="false">
                                    <label class="todo__list-label">
                                        <input class="todo__list-check" type="checkbox">
                                        Call the dentist
                                    </label>
                                </li>
                                <li class="todo__list-item" data-checked="false">
                                    <label class="todo__list-label">
                                        <input class="todo__list-check" type="checkbox">
                                        Schedule a dinner with Peter
                                    </label>
                                </li>

                                <li class="todo__list-item" data-checked="false">
                                    <label class="todo__list-label">
                                        <input class="todo__list-check" type="checkbox">
                                        Dailyui 43
                                    </label>
                                </li>
                                <li class="todo__list-item" data-checked="false">
                                    <label class="todo__list-label">
                                        <input class="todo__list-check" type="checkbox">
                                        Call the vet
                                    </label>
                                </li>
                                <li class="todo__list-item" data-checked="false">
                                    <label class="todo__list-label">
                                        <input class="todo__list-check" type="checkbox">
                                        Kate's birthday present
                                    </label>
                                </li>
                                <li class="todo__list-item" data-checked="false">
                                    <label class="todo__list-label">
                                        <input class="todo__list-check" type="checkbox">
                                        Zero inbox
                                    </label>
                                    <span></span>
                                </li>
                                <li class="todo__list-item" data-checked="false">
                                    <label class="todo__list-label">
                                        <input class="todo__list-check" type="checkbox">
                                        No alcohol today
                                    </label>
                                </li>
                                <li class="todo__list-item" data-checked="false">
                                    <label class="todo__list-label">
                                        <input class="todo__list-check" type="checkbox">
                                        Check-in to flight
                                    </label>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <button class="todo__button">
                        <i class="todo__button-icon fa-solid fa-plus"></i>
                    </button>
                </div>
            </main>
        </div>
    </div>

    <script src="./script.js"></script>
</body>

</html>
